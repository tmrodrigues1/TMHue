# Release do TMHue: dispara em tags v* (ex.: v1.1.0).
# Testa, publica o app, empacota com Velopack (Setup.exe + full + delta + releases.win.json) e
# anexa tudo à GitHub Release, junto com SHA256SUMS.txt e as notas extraídas do CHANGELOG.md.
# O feed releases.win.json é o que o app instalado consulta para descobrir novas versões
# (GithubSource sem token — releases públicas).
#
# Assinatura Authenticode é opcional. Sem os segredos CODESIGN_PFX_BASE64 e
# CODESIGN_PFX_PASSWORD, a release é publicada sem assinatura (com um aviso no log).
name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    # Configure revisores obrigatórios neste environment e guarde nele os segredos de
    # assinatura: assim nenhuma tag publica (nem assina) sem aprovação.
    environment: release
    env:
      PACK_ID: com.thiagorodrigues.TMHue
      REPO_URL: https://github.com/tmrodrigues1/TMHue
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # O nome da tag é dado controlado por quem cria a tag: chega por variável de ambiente
      # (nunca interpolado no script) e só segue adiante depois de validado.
      - name: Extrair versão da tag
        id: version
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') { throw 'Tag inválida: use vX.Y.Z.' }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT

      # Falha cedo, antes de compilar, se a versão não tiver seção no CHANGELOG.md.
      - name: Extrair notas da release do CHANGELOG
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $heading = '## [' + $env:VERSION + ']'
          $body = @()
          $inSection = $false
          foreach ($line in Get-Content CHANGELOG.md -Encoding utf8) {
            if ($inSection -and $line.StartsWith('## [')) { break }
            if ($inSection) { $body += $line }
            elseif ($line.StartsWith($heading)) { $inSection = $true }
          }
          if (-not $inSection) { throw "CHANGELOG.md não tem a seção $heading." }
          $notes = (($body -join "`n").Trim() -replace '(?m)^### ', '## ')
          if (-not $notes) { throw "A seção $heading do CHANGELOG.md está vazia." }
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'release-notes.md') -Value $notes -Encoding utf8

      # Importa o PFX no repositório de certificados do usuário do runner e assina por
      # thumbprint (/sha1): a senha nunca aparece na linha de comando do vpk/signtool,
      # que ficaria visível na listagem de processos do runner.
      - name: Preparar assinatura Authenticode
        id: signing
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) {
            Write-Warning 'Release SEM assinatura Authenticode: certificado não configurado.'
            "signed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          try {
            $password = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          } finally {
            Remove-Item $pfx -Force
          }
          "signed=true" >> $env:GITHUB_OUTPUT
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      # Modo travado: falha se o grafo de pacotes divergir dos packages.lock.json versionados.
      - name: Restaurar pacotes
        shell: pwsh
        run: |
          dotnet restore TMHue.sln --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Falha no dotnet restore (modo travado).' }

      - name: Testar
        shell: pwsh
        run: |
          dotnet test TMHue.sln -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Testes falharam; release cancelada.' }

      - name: Publicar TMHue
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet publish src/TMHue.App/TMHue.App.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=false -p:Version="$($env:VERSION).0" -p:InformationalVersion=$env:VERSION `
            -p:RestoreLockedMode=true -o artifacts/publish
          if ($LASTEXITCODE -ne 0) { throw 'Falha no dotnet publish.' }

      # A CLI precisa ser da mesma versão da biblioteca Velopack embutida no app; a versão é
      # lida do .csproj para as duas nunca divergirem.
      - name: Instalar CLI do Velopack
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/TMHue.App/TMHue.App.csproj
          $vpkVersion = ($project.Project.ItemGroup.PackageReference | Where-Object { $_.Include -eq 'Velopack' }).Version
          if (-not $vpkVersion) { throw 'Versão do pacote Velopack não encontrada em TMHue.App.csproj.' }
          dotnet tool install -g vpk --version $vpkVersion
          if ($LASTEXITCODE -ne 0) { throw "Falha ao instalar vpk $vpkVersion." }

      # Baixa a release anterior do GitHub para o vpk gerar o pacote delta.
      - name: Baixar release anterior (delta)
        shell: pwsh
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: vpk download github --repoUrl $env:REPO_URL --token $env:GITHUB_TOKEN --outputDir artifacts/releases

      - name: Empacotar com Velopack
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          THUMBPRINT: ${{ steps.signing.outputs.thumbprint }}
        run: |
          $vpkArgs = @(
            'pack',
            '--runtime', 'win-x64',
            '--packId', $env:PACK_ID,
            '--packVersion', $env:VERSION,
            '--packDir', 'artifacts/publish',
            '--mainExe', 'TMHue.exe',
            '--packTitle', 'TMHue',
            '--packAuthors', 'Thiago Rodrigues',
            '--icon', 'src/TMHue.App/Assets/tray-icon.ico',
            '--splashImage', 'packaging/velopack/splash.gif',
            '--splashProgressColor', 'None',
            '--outputDir', 'artifacts/releases',
            '--shortcuts', 'Desktop,StartMenuRoot'
          )
          if ($env:SIGNED -eq 'true') {
            $vpkArgs += @('--signParams', "/sha1 $($env:THUMBPRINT) /fd sha256 /tr http://timestamp.digicert.com /td sha256")
          }
          vpk @vpkArgs
          if ($LASTEXITCODE -ne 0) { throw 'Falha no vpk pack.' }

      # Cria a GitHub Release (estável, nunca pré-release) e anexa Setup.exe,
      # pacote completo, delta e releases.win.json.
      - name: Publicar GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          vpk upload github --repoUrl $env:REPO_URL --token $env:GITHUB_TOKEN `
            --outputDir artifacts/releases `
            --releaseName "TMHue $($env:VERSION)" --tag "v$($env:VERSION)" `
            --targetCommitish $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Falha no vpk upload.' }

      - name: Nomear instalador da release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = "v$($env:VERSION)"
          $setupName = "$($env:PACK_ID)-win-Setup.exe"
          $installerName = 'TMHUE_v' + $env:VERSION.Replace('.', '') + '.exe'
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao consultar a release.' }
          $release = @($releases | Where-Object tag_name -eq $tag)
          if ($release.Count -ne 1 -or -not $release[0].draft) { throw 'Rascunho da release não encontrado.' }
          $release = $release[0]
          $setup = @($release.assets | Where-Object name -eq $setupName)
          if ($setup.Count -ne 1) { throw 'Instalador da release não encontrado.' }
          gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/assets/$($setup[0].id)" -f "name=$installerName"
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao renomear o instalador.' }
          Move-Item -LiteralPath (Join-Path 'artifacts/releases' $setupName) -Destination (Join-Path 'artifacts/releases' $installerName)

      # docs/security.md pede ao usuário que confira o SHA-256 do que baixou. A lista é gerada
      # a partir dos arquivos realmente anexados à release, no formato do sha256sum.
      - name: Publicar SHA256SUMS.txt
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = "v$($env:VERSION)"
          $assets = gh release view $tag --repo $env:REPO_URL --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao listar os arquivos da release.' }
          # O upload do Velopack reescreve os feeds: conferir os bytes publicados, não os locais.
          $publishedDirectory = Join-Path $env:RUNNER_TEMP 'published-assets'
          gh release download $tag --repo $env:REPO_URL --dir $publishedDirectory
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao baixar os arquivos publicados para verificar os hashes.' }
          $sums = foreach ($name in $assets) {
            $file = Join-Path $publishedDirectory $name
            if (-not (Test-Path $file)) { throw "Arquivo da release não encontrado localmente: $name" }
            '{0}  {1}' -f (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant(), $name
          }
          $sumsFile = Join-Path $env:RUNNER_TEMP 'SHA256SUMS.txt'
          Set-Content -Path $sumsFile -Value $sums -Encoding utf8
          gh release upload $tag $sumsFile --repo $env:REPO_URL --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao anexar SHA256SUMS.txt.' }

      - name: Publicar release com notas
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release edit "v$($env:VERSION)" --repo $env:REPO_URL `
            --notes-file (Join-Path $env:RUNNER_TEMP 'release-notes.md') --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar a release.' }
